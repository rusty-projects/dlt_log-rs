# DLT daemon configuration for development and CI, based on the defaults of
# the dlt-daemon package. Only accept connections from localhost.
SendContextRegistration = 1
ECUId = ECU1
SharedMemorySize = 100000
LoggingMode = 0
LoggingLevel = 6
LoggingFilename = /tmp/dlt.log
EnableLoggingFileLimit = 0
TimeOutOnSend = 4
RingbufferMinSize = 500000
RingbufferMaxSize = 10000000
RingbufferStepSize = 500000
ControlSocketPath = /tmp/dlt-ctrl.sock
# IPv4 addresses must be given in IPv4-mapped IPv6 notation, as dlt-daemon
# parses all addresses as IPv6 if built with IPv6 support
BindAddress = ::1;::ffff:127.0.0.1
