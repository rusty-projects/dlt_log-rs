name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        rust_version: ["1.82", "latest", "beta", "nightly"] # 1.82: oldest supported version
      fail-fast: false

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set rust version in devcontainer
      run: ./scripts/set-rust-version.sh ${{ matrix.rust_version }}

    - name: Build and test
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:
        runCmd: ./scripts/ci.sh
