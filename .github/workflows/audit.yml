name: Security audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write # report results as check run
      issues: write # open issues for advisories found by scheduled runs

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run cargo audit
      uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
