version: 2
multi-ecosystem-groups:
  devcontainer:
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "devcontainers"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "devcontainer"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    patterns: ["*"]
    multi-ecosystem-group: "devcontainer"
  - package-ecosystem: "pip"
    directory: "/.devcontainer"
    patterns: ["*"]
    multi-ecosystem-group: "devcontainer"
